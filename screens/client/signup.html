<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/screens/login.css">
  <link rel="stylesheet" href="../../css/screens/signup.css">
</head>
<body>
  <div class="screen login">
    <div class="login-top">
      <a href="login.html" class="back">&#8249;</a>
      <h1 class="title">Sign Up</h1>
      <p class="subtitle">Please sign up to get started</p>
    </div>

    <form class="login-form">
      <label class="label" for="name">Name</label>
      <input class="input" type="text" id="name" placeholder="John Doe">

      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" placeholder="example@gmail.com">

      <label class="label" for="password">Password</label>
      <input class="input" type="password" id="password" placeholder="********">

      <label class="label" for="repeat">Re-type Password</label>
      <input class="input" type="password" id="repeat" placeholder="********">

      <button class="btn signup-btn" type="submit">Sign Up</button>
    </form>
  </div>
</body>
</html>
