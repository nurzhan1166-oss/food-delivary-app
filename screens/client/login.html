<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/screens/login.css">
</head>
<body>
  <div class="screen login">
    <div class="login-top">
      <h1 class="title">Log In</h1>
      <p class="subtitle">Please sign in to your existing account</p>
    </div>

    <form class="login-form">
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" placeholder="example@gmail.com">

      <label class="label" for="password">Password</label>
      <input class="input" type="password" id="password" placeholder="********">

      <div class="login-row">
        <label class="remember"><input type="checkbox"> Remember me</label>
        <a href="#" class="link">Forgot Password</a>
      </div>

      <button class="btn" type="submit">Log In</button>

      <p class="bottom-text">Don't have an account? <a href="#" class="link">Sign Up</a></p>
      <p class="or">Or</p>

      <div class="social">
        <span class="social-btn fb">f</span>
        <span class="social-btn tw">t</span>
        <span class="social-btn ap">a</span>
      </div>
    </form>
  </div>
</body>
